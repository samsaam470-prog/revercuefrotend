name: Generate Design System and Content
on: workflow_dispatch
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/generate-phase3.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate design system, layouts, footer, content (Phase 3)'
