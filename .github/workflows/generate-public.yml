name: Generate Public Pages
on: workflow_dispatch
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install simple-scaffold
      - run: npx simple-scaffold --config scaffold.config.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate public pages and visuals from the scaffold'
