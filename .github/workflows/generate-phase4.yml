name: Generate App and Builders
on: workflow_dispatch
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/generate-phase4.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate the real visuals, the builders, the app, the CRM, the client pages (Phase 4)'
